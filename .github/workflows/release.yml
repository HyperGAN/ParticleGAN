name: Publish to PyPI

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    name: Check release version
    if: github.repository == 'HyperGAN/ParticleGAN' || github.repository == '255BITS/ParticleGAN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.package.outputs.source_sha }}
      version: ${{ steps.package.outputs.version }}
      publish: ${{ steps.package.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the package version and check PyPI
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import tomllib
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["name"] != "particlegan":
              raise SystemExit("Expected the particlegan package")
          version = project["version"]
          expected = f"v{version}"
          tag = os.environ["RELEASE_TAG"]
          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "release" and tag != expected:
              raise SystemExit(f"Expected particlegan release {expected}, got {tag!r}")
          publish = True
          if event == "push":
              try:
                  with urlopen(f"https://pypi.org/pypi/particlegan/{quote(version, safe='')}/json", timeout=15) as response:
                      published = json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  if published["info"]["name"].lower() != "particlegan":
                      raise SystemExit("PyPI returned a different project")
                  publish = not published["urls"]
          print(f"version={version}")
          print(f"publish={str(publish).lower()}")
          PY
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Test and build release
    needs: validate-release
    if: needs.validate-release.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ needs.validate-release.outputs.source_sha }}

  publish:
    name: Publish tested distributions
    needs: [validate-release, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-${{ needs.validate-release.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/particlegan/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
