name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit validated by the release workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Replace obsolete PR checks; keep each branch, manual and release run independent.
concurrency:
  group: particlegan-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu-tests:
    name: CPU / Python ${{ matrix.python }} / shard ${{ matrix.shard }}
    # Push and PR triggers already filter branches. Apply the same scope to
    # manual dispatches while preserving immutable-source release checks.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", shard: 0}
          - {python: "3.11", shard: 1}
          - {python: "3.11", shard: 2}
          - {python: "3.11", shard: 3}
          - {python: "3.12", shard: 0}
          - {python: "3.12", shard: 1}
          - {python: "3.12", shard: 2}
          - {python: "3.12", shard: 3}
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Source-bound software tests replay exact published ancestor bytes.
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,experiments,images,lunar]'
      - name: Validate dependency installation
        run: python -m pip check
      - name: Check reviewed lint baseline
        if: matrix.python == '3.12' && matrix.shard == 0
        run: python scripts/check_lint.py
      - name: Test numerical kernels and experiment workflows
        run: >-
          python scripts/ci_pytest.py run --index ${{ matrix.shard }} --count 4
          --receipt /tmp/pytest-${{ matrix.python }}-shard-${{ matrix.shard }}.json --
          -q --durations=25 -o faulthandler_timeout=600
          --ignore=tests/test_e22_routed_caption_late_phase_renderer.py
      - name: Save collection coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: /tmp/pytest-${{ matrix.python }}-shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Test bounded late-phase renderer in a fresh process
        if: matrix.shard == 0
        run: timeout --signal=INT --kill-after=5s 60s python -m pytest -q tests/test_e22_routed_caption_late_phase_renderer.py
      - name: Exercise the complete Lunar pipeline and GIF exports
        if: matrix.python == '3.11' && matrix.shard == 0
        env:
          SDL_VIDEODRIVER: dummy
        run: python -u examples/fast_lander.py --smoke --out /tmp/lunar-smoke
      - name: Build and smoke-test installed wheel outside checkout
        if: matrix.shard == 0
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/particlegan-wheel
          python -m pip install --no-deps --target /tmp/particlegan-installed /tmp/particlegan-wheel/*.whl
          cp examples/particle_autoencoder.py /tmp/particlegan-autoencoder-smoke.py
          cp examples/quickstart_gan.py /tmp/particlegan-gan-smoke.py
          cp examples/e22_external_loop.py /tmp/particlegan-e22-smoke.py
          cp examples/e22_routed_paired.py /tmp/particlegan-e22-routed-smoke.py
          cp examples/e22_routed_sites.py /tmp/e22_routed_sites.py
          cp examples/e22_routed_replay.py /tmp/e22_routed_replay.py
          cp examples/e22_routed_game.py /tmp/e22_routed_game.py
          cp examples/e22_routed_support.py /tmp/e22_routed_support.py
          cp examples/e22_routed_readbacks.py /tmp/e22_routed_readbacks.py
          cd /tmp
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-autoencoder-smoke.py
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-gan-smoke.py --steps 2 --output /tmp/particlegan-gan-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-e22-smoke.py --steps 2 --output /tmp/particlegan-e22-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-e22-routed-smoke.py --steps 2 --output /tmp/particlegan-e22-routed-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-e22-routed-smoke.py --steps 2 --resume /tmp/particlegan-e22-routed-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_sites.py --steps 2 --output /tmp/particlegan-e22-sites-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_sites.py --steps 2 --resume /tmp/particlegan-e22-sites-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_sites.py --steps 2 --probe-interval 4 --output-error-guard --output /tmp/particlegan-e22-sites-cadence-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_sites.py --steps 2 --resume /tmp/particlegan-e22-sites-cadence-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_replay.py --steps 2
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_replay.py --steps 2 --mode no_rows
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_game.py
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_readbacks.py --sites 3 --tokens 2 --particles 16 --steps 2 --warmup-steps 1
          PYTHONPATH=/tmp/particlegan-installed python /tmp/e22_routed_support.py --compare --steps 2 --tokens 8 --particles 16 --game-diagnostics --log-every 2 --receipt /tmp/e22-capacity-smoke.json
          PYTHONPATH=/tmp/particlegan-installed python - <<'PY'
          import particlegan
          from particlegan import (
              BatchDistanceDiscriminator, DDGAN, LinearSkipDiscriminator,
              E22Policy, UpdatePolicy, ParticleRows, ScalarHeadFeatures,
              RoutedRows, RoutedBatch, RoutedCandidate, RoutedExecution,
              DEFAULT_RECIPE, MoGParticlePrior, ParticlePrior, Recipe, get_recipe, get_recipe_fields,
          )

          assert particlegan.__file__.startswith('/tmp/particlegan-installed/')
          assert ParticlePrior(num_particles=8).sample(2)[0].shape == (2, 4)
          assert MoGParticlePrior(sigma=0.1).sample(2)[0].shape == (2, 4)
          assert DDGAN().steps == 4
          default = get_recipe()
          assert DEFAULT_RECIPE == "empf"
          assert default.optimizer_svd_backend == "batched"
          assert default.training_precision == "bf16_channels_last"
          assert default == get_recipe(DEFAULT_RECIPE)
          assert Recipe(**get_recipe_fields()) == default
          assert Recipe.from_dict(default.to_dict()) == default
          assert get_recipe('gan') == default
          e22 = get_recipe('e22', num_particles=32, z_dim=2, batch_size=8)
          assert e22.name == 'e22' and e22.total_steps is None
          assert e22.continuous_policy == 'dv12' and e22.lr_control == 'stationarity'
          assert e22.row_evidence_gate and e22.particle_birth_death
          assert e22.output_noise_mode == 'learnable' and e22.serve_average == 4
          routed = get_recipe('e22_routed', num_particles=16, z_dim=2, batch_size=8)
          assert routed.row_policy == 'routed_paired'
          assert routed.row_evidence_gate and routed.particle_birth_death
          assert get_recipe('e22').row_policy == 'independent'
          assert not hasattr(default, 'make_trainer')
          assert get_recipe('ae_gan').encoder_mode == 'ae'
          assert get_recipe('vae_gan').encoder_mode == 'hard'
          assert get_recipe('ddgan').model == 'ddgan'
          assert get_recipe('ae_gan').lr == default.lr
          assert get_recipe(prior_kind='mog', sigma_rel=.025, num_particles=8).reg_coeff == 1.
          assert sum(p.numel() for p in LinearSkipDiscriminator().parameters()) == 10467
          assert sum(p.numel() for p in BatchDistanceDiscriminator().parameters()) == 19013
          PY
          PYTHONPATH=/tmp/particlegan-installed python -c "from particlegan import get_recipe; recipe = get_recipe(model='ddgan', prior_kind='mog', sigma_rel=.025, num_particles=8); assert recipe.model == 'ddgan' and recipe.lr == get_recipe().lr; assert recipe.make_prior().sigma > 0"

  base-wheel:
    name: Base wheel without optional dependencies
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install only its base requirements
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/particlegan-base-wheel
          python -m venv /tmp/particlegan-base-env
          /tmp/particlegan-base-env/bin/python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          /tmp/particlegan-base-env/bin/python -m pip install /tmp/particlegan-base-wheel/*.whl
          /tmp/particlegan-base-env/bin/python -m pip check
      - name: Import both public packages outside the checkout
        working-directory: /tmp
        run: |
          /tmp/particlegan-base-env/bin/python - <<'PY'
          import importlib.util
          from typing import get_type_hints

          assert importlib.util.find_spec('matplotlib') is None
          assert importlib.util.find_spec('PIL') is None
          import particlegan
          import particlegan_forge
          from particlegan import ManipulatedPrior, ParticlePrior
          from particlegan_forge import NamedStreams, TaskSpec, render_training_gif

          for package in (particlegan, particlegan_forge):
              assert package.__file__.startswith('/tmp/particlegan-base-env/')
          assert get_type_hints(ParticlePrior.manipulate)['return'] is ManipulatedPrior
          assert ParticlePrior(num_particles=8).sample(2)[0].shape == (2, 4)
          assert NamedStreams().generator('data').device.type == 'cpu'
          assert callable(TaskSpec) and callable(render_training_gif)
          PY
          /tmp/particlegan-base-env/bin/python -m particlegan_forge --help

  minimum-base:
    name: Minimum base dependencies / Python 3.11
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact minimum base versions
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.0'
      - name: Build and install the base wheel without experiment extras
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/minimum-wheel
          python -m pip install --no-deps /tmp/minimum-wheel/*.whl
          python -m pip check
          cp scripts/base_compatibility_smoke.py /tmp/particlegan-minimum-smoke.py
      - name: Check public API and exact checkpoint continuation outside checkout
        working-directory: /tmp
        run: python /tmp/particlegan-minimum-smoke.py

  distributions:
    name: Build release distributions
    needs: [cpu-tests, base-wheel, minimum-base]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-*-shard-*
          path: /tmp/pytest-shards
          merge-multiple: true
      - name: Require complete nonoverlapping regression coverage
        run: |
          python scripts/ci_pytest.py check /tmp/pytest-shards/pytest-3.11-shard-*.json
          python scripts/ci_pytest.py check /tmp/pytest-shards/pytest-3.12-shard-*.json
      - name: Build source archive and wheel
        run: python -m build
      - name: Keep research artifacts outside release distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          max_bytes = 600_000
          for wheel in Path('dist').glob('*.whl'):
              assert wheel.stat().st_size < max_bytes, wheel.stat().st_size
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  roots = {name.split('/')[0] for name in names}
                  license_path = next(name for name in names if name.endswith('.dist-info/licenses/LICENSE'))
                  assert archive.read(license_path) == Path('LICENSE').read_bytes()
                  metadata_path = next(name for name in names if name.endswith('.dist-info/METADATA'))
                  metadata = archive.read(metadata_path).decode()
                  assert 'License-Expression: MIT' in metadata
                  assert 'License-File: LICENSE' in metadata
              # particlegan_forge is the documented external tier API (EXPERIMENTATION.md).
              packages = {'particlegan', 'particlegan_forge'}
              assert all(root in packages or root.endswith('.dist-info') for root in roots), roots
          excluded = {
              'tests', 'reports', 'results', 'experiments', 'benchmarks', 'lib',
              'configs', 'data', 'runs', 'artifacts', 'docs', 'examples', 'ops', 'scripts',
          }
          allowed_sdist_roots = {
              'LICENSE', 'MANIFEST.in', 'PKG-INFO', 'README.md',
              'particlegan', 'particlegan.egg-info', 'particlegan_forge',
              'pyproject.toml', 'setup.cfg',
          }
          for source in Path('dist').glob('*.tar.gz'):
              assert source.stat().st_size < max_bytes, source.stat().st_size
              with tarfile.open(source) as archive:
                  names = archive.getnames()
                  roots = {parts[1] for name in names if len(parts := name.split('/')) > 1}
                  license_path = next(name for name in names if name.count('/') == 1 and name.endswith('/LICENSE'))
                  assert archive.extractfile(license_path).read() == Path('LICENSE').read_bytes()
              assert not roots & excluded, roots & excluded
              assert roots <= allowed_sdist_roots, roots - allowed_sdist_roots
          PY
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Save tested release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
